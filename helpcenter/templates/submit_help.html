{% extends "base.html" %}
{% load static %}
{% block title %} Submit Tip 
{% endblock %}
{% block extra_css %} 
<link rel="stylesheet" href="{% static 'modeldatabase/submission.css' %}"> <!-- for basic styling of submission form, really not ideal way to do this but might change later-->
<link rel="stylesheet" href="{% static 'forum/style.css' %}"> <!--note that this inherits basic formatting for sort/filter menu bubbles from the forum style.css-->
{% endblock %}
{% block content %}

<div class="content">
    <div class="container databaseinfo" id="model-submission-container">
         <form method="post" class="model-form" enctype="multipart/form-data">
            <h2>Post a Tip</h2>
            <h5>Tags:</h5>
            <div class="bubbles">
                {% for tag in tagged %}
                    <input type="checkbox" id="{{ tag.id }}" name="tags" value="{{ tag.id }}">
                    <label for="{{ tag.id }}">{{ tag }}</label>
                {% endfor %}
            </div>

            {% csrf_token %}

            {{ form.as_p}}

            <div class="upload-container">
                <span class="upload-title">📁 Choose Photo (Optional) </span> 
                <input type="file" id="image_field" class="file_upload" name="image_field">
            </div>
            
            <button type="submit">Submit Tip</button>
         </form>
    </div>
</div>

{% endblock %}
